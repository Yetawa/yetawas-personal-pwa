<style>
:root{
  --bg:#0b0f17; --bg2:#111827; --card:#151c2c; --card2:#1b2436; --line:#243049;
  --txt:#e6edf7; --txt2:#9fb0c8; --txt3:#64748b;
  --up:#ef4444; --down:#22c55e; --flat:#64748b;
  --accent:#2dd4bf; --gold:#f5b94a;
  --upbg:rgba(239,68,68,.14); --downbg:rgba(34,197,94,.14);
  --up-rgb:239,68,68; --down-rgb:34,197,94; --flat-rgb:100,116,139;
  --shadow:0 6px 24px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f5f1e8; --bg2:#efe9dc; --card:#fffdf8; --card2:#f3ede1; --line:#e3d9c6;
  --txt:#2a2418; --txt2:#6b6151; --txt3:#9a8f7c;
  --up:#e11d48; --down:#16a34a; --flat:#94a3b8;
  --accent:#0d9488; --gold:#b8860b;
  --upbg:rgba(225,29,72,.10); --downbg:rgba(22,163,74,.10);
  --up-rgb:225,29,72; --down-rgb:22,163,74; --flat-rgb:148,163,184;
  --shadow:0 6px 20px rgba(120,90,40,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--txt);font-family:-apple-system,"PingFang SC","Microsoft YaHei",Roboto,Segoe UI,sans-serif;min-height:100vh}
.topnav{position:fixed;top:0;left:0;right:0;z-index:2000;display:flex;align-items:center;gap:6px;padding:7px 10px;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.topnav::-webkit-scrollbar{display:none}
.topnav .navlink{display:inline-flex;align-items:center;background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600;text-decoration:none;white-space:nowrap;flex:none;cursor:pointer}
.topnav .navlink:hover{border-color:var(--accent);color:var(--accent)}
.topnav .navlink.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
[data-theme="light"] .topnav .navlink.active{background:#2563eb;border-color:#2563eb;color:#fff}
.topnav .navspacer{flex:1 1 auto}
@media(max-width:760px){
  .topnav{flex-wrap:wrap;overflow-x:visible;gap:5px;padding:6px 8px}
  .topnav .navlink{padding:4px 8px;font-size:12px}
  .wrap{padding:96px 10px 50px}
}
.wrap{max-width:1080px;margin:0 auto;padding:74px 14px 50px}
h1{font-size:19px;font-weight:800}
.sub{font-size:12px;color:var(--txt3);margin:6px 0 14px;line-height:1.7}
/* 添加区 */
.addbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.addbar input{background:var(--card);border:1px solid var(--line);border-radius:9px;color:var(--txt);padding:8px 11px;font-size:13px;outline:none}
.addbar input:focus{border-color:var(--accent)}
.addbar #addCode{width:130px}
.addbar #addName{width:160px;flex:1;min-width:110px}
.addbar button{background:#1f6feb;border:1px solid #1f6feb;color:#fff;border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}
[data-theme="light"] .addbar button{background:#2563eb;border-color:#2563eb}
.addbar .ghost{background:var(--card);color:var(--txt);border:1px solid var(--line)}
/* 统计卡 */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:14px}
.stats .sitem{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats .l{font-size:11.5px;color:var(--txt2)}
.stats .v{font-size:18px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stats .v.pos{color:var(--up)} .stats .v.neg{color:var(--down)}
.scroll-hint{display:none;font-size:11px;color:var(--txt3);text-align:center;padding:6px 0 2px}
@media(max-width:620px){.scroll-hint{display:block}}
/* 表格：TOP套利榜风格 + 蓝底白字表头 + 第1列锁定 + 横向滚动 */
.watch-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px}
.watchtbl{font-size:12px;table-layout:auto;width:max-content;min-width:100%;border-collapse:collapse;white-space:nowrap}
.watchtbl th{background:#1f6feb;color:#fff;font-weight:700;padding:7px 10px;position:sticky;top:0;z-index:3;text-align:center;cursor:pointer;user-select:none}
[data-theme="light"] .watchtbl th{background:#2563eb}
.watchtbl td.l{text-align:left}
/* 当前排序列：仅高亮，不出现任何三角箭头 */
.watchtbl th.sorted{background:#1756c9}
[data-theme="light"] .watchtbl th.sorted{background:#1d4ed8}
.watchtbl td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.watchtbl tbody tr:hover td{background:var(--card2)}
.watchtbl .pos{color:var(--up);font-weight:700}
.watchtbl .neg{color:var(--down);font-weight:700}
.watchtbl .codelink{color:#79c0ff;text-decoration:none;font-weight:700}
[data-theme="light"] .watchtbl .codelink{color:#2563eb}
.watchtbl .codelink:hover{text-decoration:underline}
.watchtbl .del{background:transparent;border:1px solid var(--line);color:var(--txt3);border-radius:7px;padding:3px 10px;font-size:12px;cursor:pointer}
.watchtbl .del:hover{border-color:var(--up);color:var(--up)}
/* 第1列锁定（sticky left）*/
.watchtbl th:first-child{left:0;z-index:5;background:#1f6feb}
[data-theme="light"] .watchtbl th:first-child{background:#2563eb}
.watchtbl td:first-child{position:sticky;left:0;z-index:2;background:var(--card)}
.watchtbl tbody tr:hover td:first-child{background:var(--card2)}
.empty{color:var(--txt3);font-size:13px;padding:26px;text-align:center}
.hint{font-size:11.5px;color:var(--txt3);margin-top:10px;line-height:1.8}
.hint b{color:var(--gold)}
/* 走势图 */
.chart-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:14px}
.chart-head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px;font-size:13px}
.chart-head .range{display:flex;gap:5px;flex-wrap:wrap}
.chart-head .rng{background:var(--card2);border:1px solid var(--line);color:var(--txt2);border-radius:7px;padding:4px 10px;font-size:12px;cursor:pointer}
.chart-head .rng.active{background:#1f6feb;border-color:#1f6feb;color:#fff}
[data-theme="light"] .chart-head .rng.active{background:#2563eb;border-color:#2563eb}
.chart{width:100%}
.chart .empty{color:var(--txt3);font-size:12px;padding:18px;text-align:center}

</style>
</head>

<div class="wrap">
  <h1>自选池</h1>
  <div class="sub">长按 / 右键任意页面里的基金代码即可加入；也可手动输入代码添加。数据保存在本地浏览器。</div>

  <div class="addbar">
    <input id="addCode" placeholder="代码，如 162411" maxlength="6">
    <input id="addName" placeholder="名称（留空自动补）">
    <button id="addBtn" onclick="addManual()">添加</button>
    <button onclick="clearAll()">清空</button>
    <button onclick="exportWl()">导出</button>
    <button onclick="document.getElementById('impFile').click()">导入</button>
    <button onclick="refresh(true)">刷新</button>
    <input type="file" id="impFile" accept=".json,.csv,text/csv,application/json" style="display:none">
  </div>

  <div class="stats" id="stats"></div>

  <div class="scroll-hint">← 左右滑动查看更多 →</div>
  <div class="watch-scroll">
    <table class="watchtbl" id="tbl">
      <thead><tr>
        <th data-k="code">代码</th><th data-k="name" class="l">名称</th><th data-k="price">现价</th><th data-k="date">自选日期</th><th data-k="wlprice">自选价格</th><th data-k="days">加入天数</th><th data-k="chg">累计涨跌幅</th><th>操作</th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="hint">提示：点击任意表头即可按该列排序（再次点击切换升/降序，无箭头图标，当前排序列高亮）；累计涨跌幅默认降序。自选池跟踪你关注的品种从加入日起的累计表现；可转债按「转股价值=100÷转股价×正股」自加入日至今的累计涨跌幅统计。</div>

  <div class="chart-box">
    <div class="chart-head">
      <b>自选池平均涨跌幅 vs 上证指数</b>
      <div class="range">
        <button class="rng" data-d="5">5日</button>
        <button class="rng" data-d="10">10日</button>
        <button class="rng active" data-d="30">30日</button>
        <button class="rng" data-d="180">半年</button>
        <button class="rng" data-d="250">一年</button>
      </div>
    </div>
    <div class="chart" id="chart"><div class="empty">自选池为空，无法绘制走势图</div></div>
  </div>
</div>
<script src="watchlist.js"></script>
<script>
var KEY='watchlist';
function loadW(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
function saveW(a){ try{ localStorage.setItem(KEY,JSON.stringify(a)); }catch(e){} }
function toast(msg){
  var t=document.getElementById('wlToast');
  if(!t){ t=document.createElement('div'); t.id='wlToast'; t.style.cssText='position:fixed;left:50%;bottom:26%;transform:translateX(-50%);background:rgba(15,19,28,.94);color:#e6edf7;padding:9px 18px;border-radius:9px;font-size:13px;z-index:99999;border:1px solid #2f3b52'; document.body.appendChild(t); }
  t.textContent=msg; t.style.display='block'; clearTimeout(t._t);
  t._t=setTimeout(function(){ t.style.display='none'; },1600);
}
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function daysFrom(s){
  if(!s) return null;
  var a=s.split('-').map(Number); if(a.length!==3||a.some(isNaN)) return null;
  var d1=new Date(a[0],a[1]-1,a[2]), d0=new Date();
  return Math.max(0, Math.round((d0-d1)/86400000));
}
var BASE=(location.protocol==='file:')?'http://localhost:8000':'';
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]);}); }
function fmt(v){ if(v==null||isNaN(v)) return '—'; return Number(v).toFixed(3); }
function fmtPct(v){ if(v==null||isNaN(v)) return '—'; return (v>0?'+':'')+Number(v).toFixed(2)+'%'; }

// 现价缓存（会话内）
var pxCache={};
function fetchPrice(code){
  return new Promise(function(res){
    if(pxCache[code]!==undefined){ res(pxCache[code]); return; }
    fetch(BASE+'/api/data?code='+encodeURIComponent(code)+'&days=3&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d && d.error){ pxCache[code]=null; res(null); return; }
        var rows=d.rows||[], name=d.name||'';
        var p=null;
        for(var i=rows.length-1;i>=0;i--){ if(rows[i]&&rows[i].price!=null){ p=rows[i].price; break; } }
        pxCache[code]={price:p, name:name};
        res(pxCache[code]);
      })
      .catch(function(){ pxCache[code]=null; res(null); });
  });
}

var sortKey='chg', sortDesc=true;
function setSort(k){ if(sortKey===k) sortDesc=!sortDesc; else { sortKey=k; sortDesc=true; } markSorted(); render(); }
function markSorted(){
  document.querySelectorAll('#tbl thead th[data-k]').forEach(function(th){
    th.classList.toggle('sorted', th.getAttribute('data-k')===sortKey);
  });
}
function isCB(code){ return /^1[12]\d{4}$/.test(String(code||'')); }
function priceChg(x){ return (x.price!=null&&x.wlprice!=null&&x.wlprice>0)?(x.price-x.wlprice)/x.wlprice*100:null; }

var list=[];
function render(){
  var tb=document.getElementById('tbody');
  if(!list.length){ tb.innerHTML='<tr><td colspan="8" class="empty">自选池为空——长按/右键其他页面的基金代码，或在上方输入代码添加</td></tr>'; document.getElementById('stats').innerHTML=''; return; }
  var numKeys=['price','wlprice','days','chg'];
  list.sort(function(a,b){
    var av=a[sortKey], bv=b[sortKey];
    if(av==null&&bv==null) return 0; if(av==null) return 1; if(bv==null) return -1;
    if(numKeys.indexOf(sortKey)>=0) return sortDesc?(bv-av):(av-bv);
    return sortDesc?String(bv).localeCompare(String(av),'zh'):String(av).localeCompare(String(bv),'zh');
  });
  tb.innerHTML=list.map(function(x){
    var cls=(x.chg==null)?'':(x.chg>=0?'pos':'neg');
    var link=(location.protocol==='file:')?'fund_arb.html':'/arb';
    return '<tr><td class="l"><a class="codelink" href="'+link+'?code='+x.code+'" target="_blank" data-code="'+x.code+'">'+x.code+'</a></td>'
      +'<td class="l">'+esc(x.name||'—')+'</td>'
      +'<td>'+fmt(x.price)+'</td>'
      +'<td>'+esc(x.date||'—')+'</td>'
      +'<td>'+fmt(x.wlprice)+'</td>'
      +'<td>'+(x.days==null?'—':x.days)+'</td>'
      +'<td class="'+cls+'">'+fmtPct(x.chg)+'</td>'
      +'<td><button class="del" onclick="delOne(\''+x.code+'\')">删</button></td></tr>';
  }).join('');
  // 统计
  var up=0,down=0,sum=0,cnt=0,hi=null,lo=null,hiName='',loName='';
  list.forEach(function(x){
    if(x.chg==null) return;
    cnt++; sum+=x.chg;
    if(x.chg>0) up++; else if(x.chg<0) down++;
    if(hi==null||x.chg>hi){ hi=x.chg; hiName=x.name||x.code; }
    if(lo==null||x.chg<lo){ lo=x.chg; loName=x.name||x.code; }
  });
  var avg=cnt?(sum/cnt):null;
  document.getElementById('stats').innerHTML=
    '<div class="sitem"><div class="l">自选总数</div><div class="v">'+list.length+'</div></div>'
    +'<div class="sitem"><div class="l">上涨</div><div class="v pos">'+up+'</div></div>'
    +'<div class="sitem"><div class="l">下跌</div><div class="v neg">'+down+'</div></div>'
    +'<div class="sitem"><div class="l">平均涨跌幅</div><div class="v '+(avg==null?'':(avg>=0?'pos':'neg'))+'">'+fmtPct(avg)+'</div></div>'
    +'<div class="sitem"><div class="l">最佳</div><div class="v pos">'+esc(hiName)+' '+fmtPct(hi)+'</div></div>'
    +'<div class="sitem"><div class="l">最差</div><div class="v neg">'+esc(loName)+' '+fmtPct(lo)+'</div></div>';
}

function refresh(force){
  if(force){ pxCache={}; }
  list=loadW();
  if(!list.length){ render(); lastWl=[]; lastSh=[]; renderChart(); return; }
  Promise.all(list.map(fetchPrice)).then(function(){
    list.forEach(function(x,i){
      var r=pxCache[x.code];
      if(r){ if(!x.name) x.name=r.name; x.price=r.price; }
      if(x.wlprice==null && x.price!=null) x.wlprice=x.price; // 首次加入时以当前价≈自选价
      x.days=daysFrom(x.date);
    });
    return computeChg(list);
  }).then(function(){
    saveW(list); render(); loadChart(!!force);
  });
}
var cbMapCache=null;
function loadCbMap(){
  if(cbMapCache) return Promise.resolve(cbMapCache);
  return fetch(BASE+'/api/cb?force=0').then(function(r){ return r.json(); }).then(function(d){
    var m={}; (d.picks||[]).forEach(function(p){ if(p&&p.code) m[p.code]=p; });
    cbMapCache=m; return m;
  }).catch(function(){ cbMapCache={}; return cbMapCache; });
}
// 累计涨跌幅：普通品种=现价/自选价；可转债=正股(转股价值与之同比例)自加入日至今的累计涨跌
function computeChg(list){
  var bonds=list.filter(function(x){ return isCB(x.code); });
  if(!bonds.length){ list.forEach(function(x){ x.chg=priceChg(x); }); return Promise.resolve(); }
  return loadCbMap().then(function(map){
    return Promise.all(bonds.map(function(x){
      var info=map[x.code];
      if(!info || !info.stock_code){ x._bond=false; x.chg=priceChg(x); return; }
      x._bond=true; x._stock=info.stock_code;
      if(info.price!=null){ x.price=info.price; if(x.wlprice==null) x.wlprice=info.price; }
      if(info.name) x.name=info.name;
      return klineFor(info.stock_code).then(function(sm){
        x._conv = sm; // 正股价格序列（转股价值=常数×正股价，故同比例）
        var dates=Object.keys(sm).filter(function(d){ return d>=x.date; }).sort();
        var watchP = dates.length? sm[dates[0]] : null;
        var allD=Object.keys(sm).sort();
        var nowP = allD.length? sm[allD[allD.length-1]] : null;
        x.chg = (watchP!=null && nowP!=null && watchP>0)? (nowP-watchP)/watchP*100 : priceChg(x);
        x._convWatch = watchP;
      });
    }));
  }).then(function(){ list.forEach(function(x){ if(x.chg==null) x.chg=priceChg(x); }); });
}

/* ===== 走势图：自选池平均涨跌幅 vs 上证指数（逐日对齐） ===== */
var chartDays=30, chartCache={}, lastWl=[], lastSh=[];
function klineFor(code){
  return new Promise(function(res){
    if(chartCache[code]){ res(chartCache[code]); return; }
    fetch(BASE+'/api/kline?code='+encodeURIComponent(code)+'&days=260&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        var m={}; (d.rows||[]).forEach(function(x){ m[x.date]=x.close; });
        chartCache[code]=m; res(m);
      })
      .catch(function(){ chartCache[code]={}; res(chartCache[code]); });
  });
}
function loadChart(force){
  if(force) chartCache={};
  var chart=document.getElementById('chart');
  if(!list.length){ if(chart) chart.innerHTML='<div class="empty">自选池为空，无法绘制走势图</div>'; lastWl=[]; lastSh=[]; renderChart(); return; }
  if(chart) chart.innerHTML='<div class="empty">加载走势图…</div>';
  // 每项：普通品种取价格序列；可转债取转股价值序列
  var tasks=list.map(function(x){
    if(x._bond && x._conv){ return Promise.resolve({x:x, map:x._conv, base:x._convWatch}); }
    return klineFor(x.code).then(function(m){ return {x:x, map:m, base:x.wlprice}; });
  });
  Promise.all(tasks).then(function(res){
    var daySum={}, dayCnt={};
    res.forEach(function(o){
      var m=o.map, base=o.base; if(!base||base<=0) return;
      Object.keys(m).forEach(function(d){
        if(o.x.date && d < o.x.date) return;
        var v=(m[d]/base-1)*100;
        daySum[d]=(daySum[d]||0)+v; dayCnt[d]=(dayCnt[d]||0)+1;
      });
    });
    var wl=Object.keys(daySum).filter(function(d){ return dayCnt[d]>0; }).sort().map(function(d){ return {date:d, v:daySum[d]/dayCnt[d]}; });
    return klineFor('sh000001').then(function(shMap){
      var sd=Object.keys(shMap).sort();
      var baseSh=sd.length? shMap[sd[0]] : null;
      // 上证指数与自选序列对齐到同一组日期（缺失日跳过），起点归零
      var sh=wl.map(function(p){
        var c=shMap[p.date];
        if(c==null||baseSh==null||baseSh<=0) return {date:p.date, v:null};
        return {date:p.date, v:(c/baseSh-1)*100};
      });
      lastWl=wl; lastSh=sh; renderChart();
    });
  });
}
function renderChart(){
  var box=document.getElementById('chart'); if(!box) return;
  var wl=lastWl.slice(-chartDays), sh=lastSh.slice(-chartDays);
  if(!wl.length){ box.innerHTML='<div class="empty">暂无走势数据</div>'; return; }
  var dates=wl.map(function(x){ return x.date; });
  var W=680,H=230,padL=46,padR=14,padT=14,padB=22;
  var vals=wl.concat(sh).map(function(x){ return x.v; }).filter(function(v){ return v!=null; });
  var max=0.5; vals.forEach(function(v){ if(Math.abs(v)>max) max=Math.abs(v); });
  var innerH=H-padT-padB, y0=padT+innerH/2, yScale=innerH/2/max;
  function px(v){ return y0-v*yScale; }
  function path(series){
    var started=false, out='';
    series.forEach(function(s,i){
      if(s.v==null) return;
      var x=padL+(dates.length<=1?0:(W-padL-padR)*i/(dates.length-1));
      out += (started?'L':'M')+x.toFixed(1)+' '+px(s.v).toFixed(1)+' ';
      started=true;
    });
    return out.trim();
  }
  var isLight=document.documentElement.getAttribute('data-theme')==='light';
  var wlCol=isLight?'#0d9488':'#2dd4bf';   // 自选：强调深色
  var shCol=isLight?'#b8a988':'#9fb0c8';   // 上证：浅色
  var grid='<line x1="'+padL+'" y1="'+y0.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y0.toFixed(1)+'" stroke="var(--txt3)" stroke-width="0.8"/>';
  [0.5,1,2,3].forEach(function(g){
    if(max<g) return;
    var y=px(g);
    grid+='<line x1="'+padL+'" y1="'+y.toFixed(1)+'" x2="'+(W-padR)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="0.5" stroke-dasharray="3,3"/>';
    grid+='<text x="'+(padL-4)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--txt3)">+'+g+'%</text>';
    grid+='<text x="'+(padL-4)+'" y="'+(px(-g)+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--txt3)">-'+g+'%</text>';
  });
  var lblIdx=[0, Math.floor((dates.length-1)/2), dates.length-1];
  lblIdx.forEach(function(i){
    var x=padL+(dates.length<=1?0:(W-padL-padR)*i/(dates.length-1));
    grid+='<text x="'+x.toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" font-size="9" fill="var(--txt3)">'+dates[i].slice(5)+'</text>';
  });
  var legend='<div style="display:flex;gap:14px;justify-content:center;font-size:11px;color:var(--txt2);margin-bottom:4px">'
    +'<span><span style="display:inline-block;width:16px;height:3px;background:'+wlCol+';vertical-align:middle;margin-right:4px"></span>自选池平均涨跌幅</span>'
    +'<span><span style="display:inline-block;width:16px;height:3px;background:'+shCol+';vertical-align:middle;margin-right:4px"></span>上证指数</span></div>';
  box.innerHTML=legend+'<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">'+grid
    +'<path d="'+path(wl)+'" fill="none" stroke="'+wlCol+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'
    +'<path d="'+path(sh)+'" fill="none" stroke="'+shCol+'" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>'
    +'</svg>';
}
document.querySelectorAll('.rng').forEach(function(b){

    document.querySelectorAll('.rng').forEach(function(x){ x.classList.remove('active'); });
    b.classList.add('active');
    chartDays=parseInt(b.getAttribute('data-d'),10)||30;

});

function addManual(){
  var code=(document.getElementById('addCode').value||'').trim();
  var name=(document.getElementById('addName').value||'').trim();
  if(!/^\d{6}$/.test(code)){ toast('请输入6位数字代码'); return; }
  fetchPrice(code).then(function(r){
    if(!r || !r.name){ if(!name){ toast('未能自动识别，请补名称'); return; } }
    var arr=loadW();
    if(arr.some(function(x){ return x.code===code; })){ toast('已在自选池'); return; }
    arr.unshift({code:code, name:(name||(r&&r.name)||''), date:todayStr(), wlprice:(r&&r.price)||null});
    saveW(arr);
    document.getElementById('addCode').value=''; document.getElementById('addName').value='';
    toast('已添加：'+code); refresh();
  });
}
function delOne(code){
  var arr=loadW().filter(function(x){ return x.code!==code; });
  saveW(arr); toast('已删除：'+code); refresh();
}
function clearAll(){
  if(!loadW().length) return;
  if(!confirm('确定清空全部自选？')) return;
  saveW([]); toast('已清空'); refresh();
}
function exportWl(){
  var data=JSON.stringify(loadW(),null,1);
  var blob=new Blob([data],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='watchlist_'+todayStr()+'.json'; a.click();
  URL.revokeObjectURL(a.href);
}
document.getElementById('impFile').addEventListener('change',function(ev){
  var f=ev.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var text=rd.result;
      var arr=[];
      if(text.trim().charAt(0)==='['){
        arr=JSON.parse(text);
        if(!Array.isArray(arr)) throw 0;
      }else{
        // CSV：首列代码，第二列名称（可带 BOM/表头，兼容导出的 CSV 首行"来源：..."）
        text.split(/\r?\n/).forEach(function(line){
          line=(line||'').replace(/^\uFEFF/,'').trim();
          if(!line) return;
          if(line.indexOf('来源：')===0) return;
          var m=line.match(/"?([0-9]{6})"?/);
          if(!m) return;
          var cols=line.split(',').map(function(c){ return c.replace(/^"|"$/g,'').trim(); });
          if(!cols[0]) return;
          arr.push({code:cols[0], name:cols[1]||'', date:cols[3]||todayStr(), wlprice:cols[4]!=null&&cols[4]!==''&&!isNaN(cols[4])?parseFloat(cols[4]):null});
        });
      }
      var cur=loadW();
      var added=0;
      arr.forEach(function(x){
        if(x&&x.code&&/^\d{6}$/.test(String(x.code))&&!cur.some(function(c){return c.code===String(x.code);})){
          cur.push({code:String(x.code), name:x.name||'', date:x.date||todayStr(), wlprice:(x.price!=null&&!isNaN(x.price))?Number(x.price):null});
          added++;
        }
      });
      saveW(cur); toast('导入 '+added+' 条'); refresh(true);
    }catch(e){ toast('导入文件格式不对'); }
  };
  rd.readAsText(f, 'utf-8');
  ev.target.value='';
});

// 表头点击排序（无三角，仅高亮当前排序列）
document.querySelectorAll('#tbl thead th[data-k]').forEach(function(th){

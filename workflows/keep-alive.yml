name: keep-render-alive

on:
  schedule:
    - cron: "*/10 * * * *"   # 每 10 分钟 ping 一次，保活 Render 免费实例，避免 15min 无访问后 30-50s 唤醒
  workflow_dispatch:         # 允许在 Actions 页面手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render service
        run: curl -fsS --max-time 25 https://fund-arb.onrender.com/ || true

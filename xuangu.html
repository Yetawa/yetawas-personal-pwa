<title>自编公式选股</title>
<style>
:root{--ink:#2C3E50;--teal:#5F9E8F;--paper:#F7F4ED;--line:#E4DDD0;--text:#333;--dim:#8A8578;
--red:#C0392B;--green:#1E8449}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;overflow-x:hidden}
body{background:var(--paper);color:var(--text);font-size:15px;line-height:1.6;
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
-webkit-text-size-adjust:100%;padding-bottom:96px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 0}

header{display:flex;align-items:flex-start;justify-content:space-between;padding-bottom:10px}
h1{font-size:19px;color:var(--ink);font-weight:600;letter-spacing:.3px}
h1 span{font-size:11px;color:var(--dim);font-weight:400;margin-left:7px}
.meta{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.7}
.meta b{color:var(--ink);font-weight:600}
#gear{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line);
color:var(--dim);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin-top:2px}

.bar{margin:2px 0 16px}
.pb{height:3px;background:#E8E2D6;border-radius:2px;overflow:hidden}
.pb i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s ease}
.msg{font-size:12px;color:var(--dim);margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.err{color:var(--red);white-space:normal}

section{margin-bottom:20px}
h2{font-size:15px;color:var(--ink);font-weight:600;border-left:3px solid var(--teal);
padding-left:9px;display:flex;align-items:center;margin-bottom:8px;line-height:1.3}
h2 em{font-style:normal;font-size:11.5px;color:var(--dim);font-weight:400;margin-left:8px}
h2 small{font-size:11px;color:#A8A092;font-weight:400;margin-left:auto}
.tb{background:#fff;border-radius:9px;box-shadow:0 1px 3px rgba(44,62,80,.06);overflow:hidden}
.item{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border-top:1px solid var(--line)}
.item:first-child{border-top:none}
.l{flex:1 1 auto;min-width:0;padding-right:10px}
.nm{font-size:14.5px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{font-size:11.5px;color:var(--dim);margin-top:3px;font-variant-numeric:tabular-nums;
overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg{flex:0 0 auto;font-size:16px;font-weight:600;font-variant-numeric:tabular-nums;text-align:right}
.up{color:var(--red)}.down{color:var(--green)}.flat{color:#666}
.st{display:inline-block;font-style:normal;font-size:9.5px;line-height:1.4;color:#fff;
background:#B0846A;border-radius:3px;padding:0 3px;margin-left:4px;vertical-align:1.5px}
.multi{font-size:10px;color:var(--teal);border:1px solid #CBDCD7;border-radius:3px;
padding:0 3px;margin-left:4px;vertical-align:1.5px;white-space:nowrap}

.empty{background:#fff;border-radius:9px;padding:30px 18px;text-align:center;color:var(--dim);
font-size:13px;box-shadow:0 1px 3px rgba(44,62,80,.06);line-height:1.75}
.empty b{display:block;color:var(--ink);font-size:15px;font-weight:600;margin-bottom:6px}

.hist{margin:2px 0 8px}
.hist .t{font-size:11.5px;color:var(--dim);margin-bottom:7px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-size:12px;color:var(--ink);background:#fff;border:1px solid var(--line);
border-radius:14px;padding:4px 11px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip u{text-decoration:none;color:var(--dim);margin-left:4px;font-size:11px}
.chip.on u{color:rgba(255,255,255,.7)}

/* 回测 */
.btop{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{background:#fff;border:1px solid var(--line);color:var(--ink);font-size:12.5px;
padding:6px 12px;border-radius:8px;font-weight:500}
.btt{font-size:12px;color:var(--dim)}
.bench{background:#fff;border-radius:9px;padding:11px 13px;font-size:12.5px;color:var(--dim);
margin-bottom:14px;box-shadow:0 1px 3px rgba(44,62,80,.06);line-height:1.9}
.bench b{font-weight:600;font-variant-numeric:tabular-nums}
.kbox{background:#fff;border-radius:9px;box-shadow:0 1px 3px rgba(44,62,80,.06);
display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.kbox.dim{padding:22px;text-align:center;font-size:13px;color:var(--dim);display:block}
.k{padding:11px 13px;border-top:1px solid var(--line);border-right:1px solid var(--line)}
.k:nth-child(1),.k:nth-child(2){border-top:none}
.k:nth-child(2n){border-right:none}
.k span{display:block;font-size:11.5px;color:var(--dim)}
.k b{display:block;font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.note{font-size:11.5px;color:#A8A092;line-height:1.9;margin:6px 0 10px}

/* 数据面板 */
.panel{display:none;background:#fff;border-radius:9px;padding:15px;margin-bottom:16px;
box-shadow:0 1px 3px rgba(44,62,80,.06)}
.panel.on{display:block}
.panel .pt{font-size:13px;color:var(--dim);line-height:2;margin-bottom:12px}
.panel .pt b{color:var(--ink);font-weight:600}
.panel .prow{display:flex;gap:9px}
.panel button{flex:1;font-size:13px;padding:10px 0;border-radius:8px;border:1px solid var(--line);
background:#FAF8F3;color:var(--ink);font-weight:500}
.panel button.warn{color:#A33;border-color:#E8CBCB;background:#FDF7F7}

.dock{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom));
background:linear-gradient(to top,var(--paper) 74%,rgba(247,244,237,0));
display:flex;gap:8px;max-width:560px;margin:0 auto}
button{font-family:inherit;cursor:pointer;transition:transform .1s}
button:active{transform:scale(.985)}
#cp{flex:0 0 62px;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;
font-size:13px;font-weight:500}
#cp:disabled{color:#BFC4C8}
#bt{flex:1;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:10px;
font-size:15px;font-weight:500;letter-spacing:.3px}
#go{flex:1.5;background:var(--ink);color:#fff;border:none;border-radius:10px;font-size:15px;
font-weight:600;letter-spacing:.3px;box-shadow:0 2px 8px rgba(44,62,80,.22)}
#go:disabled{background:#A8AFB5;box-shadow:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>自编公式选股<span>本地版</span></h1>
      <div class="meta" id="meta">正在读取本地数据…</div>
    </div>
    <div id="gear">⋯</div>
  </header>

  <div class="bar">
    <div class="pb"><i id="pbi"></i></div>
    <div class="msg" id="msg">就绪</div>
  </div>

  <div class="panel" id="panel">
    <div class="pt" id="ptxt">读取中…</div>
    <div class="prow">
      <button id="sync">同步日线</button>
      <button id="wipe" class="warn">清空数据</button>
    </div>
  </div>

  <main id="list"></main>

  <div class="hist" id="histBox" style="display:none">
    <div class="t">历史</div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div class="dock">
  <button id="cp">复制</button>
  <button id="bt">回测</button>
  <button id="go">刷新选股</button>
</div>

<script>
/* 策略引擎 · 通达信公式的 JS 实现
 * 与 Python 版 engine.py 逐条对应，返回全序列信号（0/1）
 */
(function (root) {
  'use strict';
  var NAN = NaN;

  function FA(n, v) { var a = new Float64Array(n); if (v !== undefined) a.fill(v); return a; }
  function BA(n) { return new Uint8Array(n); }

  /* ---------- 通达信函数 ---------- */
  function REF(a, k) {
    var n = a.length, o = FA(n, NAN);
    if (k <= 0) { o.set(a); return o; }
    for (var i = k; i < n; i++) o[i] = a[i - k];
    return o;
  }

  function MA(a, n) {
    var len = a.length, o = FA(len, NAN), s = 0;
    for (var i = 0; i < len; i++) {
      var x = a[i]; if (x !== x) x = 0;
      s += x;
      if (i >= n) { var y = a[i - n]; if (y !== y) y = 0; s -= y; }
      if (i >= n - 1) o[i] = s / n;
    }
    return o;
  }

<script>
/* 数据层：腾讯行情（列表 + 批量快照 + 日线） + 手机本地库(IndexedDB)
 * 不依赖新浪：新浪对高频请求会限流，浏览器端不可靠。
 */
(function (global) {
  'use strict';

  var N_KEEP = 210;
  var DB_NAME = 'tdx_picker';
  var DB_VER = 1;
  var BATCH = 60;          // 每次批量快照的股票数

  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

  function pool(items, worker, concurrency, onTick) {
    var i = 0, done = 0, total = items.length;
    function run() {
      return new Promise(function (resolve) {
        function step() {
          if (i >= total) return resolve();
          var k = i++;
          worker(items[k], k).catch(function () { }).then(function () {
            done++;
            if (onTick && done % 10 === 0) onTick(done, total);
            step();
          });
        }
        step();
      });
    }
    var arr = [];
    for (var c = 0; c < concurrency; c++) arr.push(run());
    return Promise.all(arr).then(function () { if (onTick) onTick(total, total); });
  }

  function retry(fn, times) {
    times = times || 3;
    var p = Promise.resolve();
    for (var i = 0; i < times; i++) {
      (function (t) {
        p = p.then(function () { return fn(); }).catch(function (e) {
          if (t === times - 1) throw e;
          return sleep(250 * (t + 1)).then(function () { return fn(); });
        });
      })(i);
    }
    return p;
  }

  /* ---------- IndexedDB ---------- */
  var _db = null;
  function db() {
    if (_db) return _db;
    _db = new Promise(function (res, rej) {
      var q = indexedDB.open(DB_NAME, DB_VER);
      q.onupgradeneeded = function () {
        var d = q.result;
        if (!d.objectStoreNames.contains('k')) d.createObjectStore('k');
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      };
      q.onsuccess = function () { res(q.result); };
      q.onerror = function () { rej(q.error); };
    });
    return _db;
  }

  function putKlines(entries) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('k', 'readwrite'), os = tx.objectStore('k');
        entries.forEach(function (e) { os.put(e.v, e.code); });
        tx.oncomplete = function () { res(); };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }

  function loadAllKlines() {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var tx = d.transaction('k', 'readonly'), os = tx.objectStore('k');
        var kq = os.getAllKeys(), vq = os.getAll();
        tx.oncomplete = function () {
          var m = new Map();
          for (var i = 0; i < kq.result.length; i++) m.set(kq.result[i], vq.result[i]);
          res(m);
        };
        tx.onerror = function () { rej(tx.error); };
      });
    });
  }

  function getMeta() {
    return db().then(function (d) {
      return new Promise(function (res) {
        var tx = d.transaction('meta', 'readonly');
        var q = tx.objectStore('meta').get('info');
        tx.oncomplete = function () { res(q.result || null); };
        tx.onerror = function () { res(null); };
      });
    });
  }

  function putMeta(v) {
    return db().then(function (d) {
      return new Promise(function (res) {
        var tx = d.transaction('meta', 'readwrite');
        tx.objectStore('meta').put(v, 'info');
        tx.oncomplete = function () { res(); };
      });
    });
  }

  function clearAll() {
    return db().then(function (d) {
      return new Promise(function (res) {
        var tx = d.transaction(['k', 'meta'], 'readwrite');
        tx.objectStore('k').clear();
        tx.objectStore('meta').clear();
        tx.oncomplete = function () { res(); };
      });
    });
  }

  /* ---------- 股票列表（腾讯排行） ---------- */
  function listUrl(p, n) {
    return 'https://proxy.finance.qq.com/ifzqgtimg/appstock/app/mktHs/rank?l=' + n + '&p=' + p + '&t=ranka/chr&o=0';
  }

  function fetchStockList(onTick) {
    var codes = [], p = 1, empty = 0;
    function next() {
      if (p > 40 || empty >= 2) return Promise.resolve(codes);
      return retry(function () {
        return fetch(listUrl(p, 200), { cache: 'no-store' }).then(function (r) { return r.json(); });
      }).then(function (j) {
        var arr = (j && j.data) || [];
        if (!arr.length) { empty++; p++; return next(); }
        var added = 0;
        arr.forEach(function (x) {
          var c = String(x.code || '');
          var num = c.slice(2);
          if (!/^\d{6}$/.test(num)) return;
          if (!/^(60|00|30)/.test(num)) return;
          if (codes.indexOf(num) < 0) { codes.push(num); added++; }
        });
        if (onTick) onTick(p);
        p++;
        return added ? next() : next();
      }).catch(function () { empty++; p++; return next(); });
    }
    return next();
  }

  /* ---------- 批量快照 ---------- */
  function fetchSnapChunk(chunk) {
    var q = chunk.map(function (c) { return (c[0] === '6' ? 'sh' : 'sz') + c; }).join(',');
    return retry(function () {
      return fetch('https://qt.gtimg.cn/q=' + q, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.arrayBuffer();
      });
    }).then(function (b) {
      var txt = new TextDecoder('gbk').decode(b);
      var out = [];
      txt.split(';').forEach(function (seg) {
        var m = seg.match(/v_(sh|sz)(\d{6})="([^"]*)"/);
        if (!m) return;
        var f = m[3].split('~');
        if (f.length < 46) return;
        var price = +f[3], prev = +f[4];
        if (!(price > 0) || !(prev > 0)) return;
        out.push({
          code: m[2], name: f[1],
          open: +f[5], high: +f[33], low: +f[34],
          close: price, prev: prev,
          vol: +f[6], turnover: +f[38],
          pe: +f[39] || 0, nmc: (+f[44] || 0) * 10000
        });
      });
      return out;
    });
  }

  function fetchSnapshot(codes, onTick) {
    return Promise.resolve(codes).then(function (cs) {
      if (cs && cs.length) return cs;
      return fetchStockList();
    }).then(function (list) {
      var chunks = [];
      for (var i = 0; i < list.length; i += BATCH) chunks.push(list.slice(i, i + BATCH));
      var out = [];
      return pool(chunks, function (ch) {
        return fetchSnapChunk(ch).then(function (arr) { for (var i = 0; i < arr.length; i++) out.push(arr[i]); });
      }, 6, function (d, t) { if (onTick) onTick(d, t); }).then(function () {
        return out;
      });
    });
  }

  /* ---------- 日线 ---------- */
  function fetchKline(code) {
    var sym = (code[0] === '6' ? 'sh' : 'sz') + code;
    var url = 'https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=' + sym + ',day,,,' + (N_KEEP + 20);
    return retry(function () {
      return fetch(url, { cache: 'no-store' }).then(function (r) {
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      });
    }).then(function (j) {
      var node = j.data && j.data[sym];
      if (!node) throw new Error('no data');
      var arr = node.day || node.qfqday;
      if (!arr || !arr.length) throw new Error('empty');
      var st = Math.max(0, arr.length - N_KEEP);
      var n = arr.length - st;
      var o = new Int32Array(n), h = new Int32Array(n), l = new Int32Array(n),
        c = new Int32Array(n), v = new Int32Array(n);
      for (var i = 0; i < n; i++) {
        var r0 = arr[st + i];
        o[i] = Math.round(+r0[1] * 1000);
        c[i] = Math.round(+r0[2] * 1000);
        h[i] = Math.round(+r0[3] * 1000);
        l[i] = Math.round(+r0[4] * 1000);
        v[i] = Math.round(+r0[5]);
      }
      return { n: n, o: o, h: h, l: l, c: c, v: v };
    });
  }

  function fetchLatestDate() {
    var url = 'https://web.ifzq.gtimg.cn/appstock/app/kline/kline?param=sh600000,day,,,3';
    return retry(function () {
      return fetch(url, { cache: 'no-store' }).then(function (r) { return r.json(); });
    }).then(function (j) {
      var arr = j.data.sh600000.day;
      return arr[arr.length - 1][0];
    });
  }

  function downloadAll(codes, have, onProgress) {
    var todo = codes.filter(function (c) { return !have.has(c); });
    var buf = [], failed = 0;
    return pool(todo, function (code) {
      return fetchKline(code).then(function (k) {
        buf.push({ code: code, v: k });
        if (buf.length >= 120) {
          var batch = buf; buf = [];
          return putKlines(batch);
        }
      }).catch(function () { failed++; });
    }, 6, function (d, t) { if (onProgress) onProgress(d, t, failed); })
      .then(function () { return buf.length ? putKlines(buf) : null; })
      .then(function () { return { ok: todo.length - failed, failed: failed, total: todo.length }; });
  }

  global.TDXData = {
    N_KEEP: N_KEEP,
    fetchStockList: fetchStockList,
    fetchSnapshot: fetchSnapshot,
    fetchKline: fetchKline,
    fetchLatestDate: fetchLatestDate,
    downloadAll: downloadAll,
    loadAllKlines: loadAllKlines,
    putKlines: putKlines,
    getMeta: getMeta,
    putMeta: putMeta,
    clearAll: clearAll
  };
})(typeof window !== 'undefined' ? window : globalThis);

      var cached = K.size > 500 ? Array.from(K.keys()) : null;
      var snap = await TDXData.fetchSnapshot(cached, function (d, t) { stage('行情 ' + d + '/' + t, 8 + 4 * d / t); });
      if (snap.length < 500) throw new Error('只取到 ' + snap.length + ' 只行情，可能未开盘或被限流，稍后再试');

      if (K.size < 500) {
        // 首次：下载全市场日线
        stage('首次使用，下载全市场日线（约 3-5 分钟）', 12);
        await TDXData.downloadAll(snap.map(function (s) { return s.code; }), new Set(K.keys()), function (d, t, f) {
          stage('下载日线 ' + d + '/' + t + (f ? '（失败 ' + f + '）' : ''), 12 + 72 * d / t);
        });
        K = S.K = await TDXData.loadAllKlines();
      } else if (S.meta.lastDate && S.meta.lastDate !== latest) {
        var gap = (new Date(latest) - new Date(S.meta.lastDate)) / 86400000;
        if (gap > 6) stage('本地数据落后 ' + Math.round(gap) + ' 天，建议先「同步日线」', 12);
        else {
          var entries = [];
          snap.forEach(function (s) {
            var k = K.get(s.code);
            if (!k) return;
            var n = k.n + 1;
            var o = new Int32Array(n), h = new Int32Array(n), l = new Int32Array(n), c = new Int32Array(n), v = new Int32Array(n);
            o.set(k.o); h.set(k.h); l.set(k.l); c.set(k.c); v.set(k.v);
            o[n - 1] = Math.round(s.open * 1000); h[n - 1] = Math.round(s.high * 1000);
            l[n - 1] = Math.round(s.low * 1000); c[n - 1] = Math.round(s.close * 1000);
            v[n - 1] = Math.round(s.vol);
            var nk = { n: n, o: o, h: h, l: l, c: c, v: v };
            K.set(s.code, nk);
            entries.push({ code: s.code, v: nk });
          });
          if (entries.length) await TDXData.putKlines(entries);
        }
      }

      var stk = {};
      snap.forEach(function (s) { stk[s.code] = [s.name, s.nmc, s.pe]; });
      S.meta = { lastDate: latest, updatedAt: Date.now(), stocks: stk, count: snap.length };
      await TDXData.putMeta(S.meta);

      stage('计算六大策略', 86);
      var rows = await compute(K, snap, latest);
      var ts = fmtTs();
      S.rows = rows;
      renderRows(rows, '数据 <b>' + latest + '</b> ｜ 命中 <b>' + rows.length + '</b> 只 ｜ ' + ts);
      saveHist(latest, rows, ts);
      renderChips();
      updateMeta();
      stage('完成，命中 ' + rows.length + ' 只', 100);
      $('cp').disabled = !rows.length;
    } catch (e) {
      stage('出错：' + e.message, 100, 'err');
      console.error(e);
    } finally {
      busy(false);
    }
  }

  async function compute(K, snap, date) {
    var mm = new Map();
    snap.forEach(function (s) { mm.set(s.code, s); });
    var codes = [];
    K.forEach(function (v, k) { if (mm.has(k)) codes.push(k); });
    var rows = [];
    var CH = 250;
    for (var i = 0; i < codes.length; i += CH) {
      var end = Math.min(i + CH, codes.length);
      for (var j = i; j < end; j++) {
        var code = codes[j], k = K.get(code), m = mm.get(code);
        if (!k || k.n < 130) continue;
        var o = p64(k.o), h = p64(k.h), l = p64(k.l), c = p64(k.c), v = f64(k.v);
        var r = TDXEngine.evaluate(o, h, l, c, v, code, m.name, m.pe, m.nmc / m.close, m.nmc);
        var tags = [];
        for (var s = 0; s < STRATS.length; s++) if (r[STRATS[s]][k.n - 1]) tags.push(STRATS[s]);
        if (tags.length) {
          rows.push({
            code: code, name: m.name, price: m.close,
            chg: (m.close / m.prev - 1) * 100, nmc: m.nmc / 10000,
            turnover: m.turnover, tags: tags
          });
        }
      }
      stage('计算中 ' + end + '/' + codes.length, 86 + 12 * end / codes.length);
      await sleep(0);
    }
    rows.sort(function (a, b) { return STRATS.indexOf(a.tags[0]) - STRATS.indexOf(b.tags[0]); });
    return rows;
  }

  /* ---------- 回测 ---------- */
  async function runBacktest() {
    if (S.busy) return;
    busy(true);
    S.view = 'bt';
    try {
      var K = await ensureK();
      if (K.size < 500) throw new Error('本地还没有日线数据，先点「刷新选股」完成首次下载');
      S.meta = (await TDXData.getMeta()) || {};
      var stk = S.meta.stocks || {};
      var DAYS = 60;
      var pool = {}, bench = { 1: [], 3: [], 5: [] }, sig = {};
      STRATS.forEach(function (s) { pool[s] = { 1: [], 3: [], 5: [] }; sig[s] = 0; });
      var codes = Array.from(K.keys());
      var CH = 200;
      for (var i = 0; i < codes.length; i += CH) {
        var end = Math.min(i + CH, codes.length);
        for (var j = i; j < end; j++) {
          var code = codes[j], k = K.get(code);
          if (!k || k.n < 135) continue;
          var o = p64(k.o), h = p64(k.h), l = p64(k.l), c = p64(k.c), v = f64(k.v);
          var n = k.n, from = Math.max(0, n - DAYS), to = n - 6;
          var info = stk[code] || ['X', 500000, 10];
          var nmcv = info[1] || 500000;
          var r = TDXEngine.evaluate(o, h, l, c, v, code, info[0], info[2] || 10, nmcv / c[n - 1], nmcv);
          // 基准
          for (var b = from; b <= to; b++) {
            var buy0 = o[b + 1];
            if (!(buy0 > 0)) continue;
            [1, 3, 5].forEach(function (d) {
              var px = c[b + d];
              if (px > 0) bench[d].push(px / buy0 - 1);
            });
          }
          for (var s = 0; s < STRATS.length; s++) {
            var arr = r[STRATS[s]];
            for (var b2 = from; b2 <= to; b2++) {
              if (!arr[b2]) continue;
              var buy = o[b2 + 1];
              if (!(buy > 0)) continue;
              sig[STRATS[s]]++;
              [1, 3, 5].forEach(function (d) {
                var px = c[b2 + d];
                if (px > 0) pool[STRATS[s]][d].push(px / buy - 1);
              });
            }
          }
        }
        stage('回测中 ' + end + '/' + codes.length, 100 * end / codes.length);
        await sleep(0);
      }

      function st(a) {
        if (!a.length) return null;
        var s = 0, w = 0, mx = -9, mn = 9;
        for (var i = 0; i < a.length; i++) { s += a[i]; if (a[i] > 0) w++; if (a[i] > mx) mx = a[i]; if (a[i] < mn) mn = a[i]; }
        return { n: a.length, win: w / a.length * 100, avg: s / a.length * 100, best: mx * 100, worst: mn * 100 };
      }
      var out = { rows: [], bench: {}, days: DAYS, ts: fmtTs() };
      [1, 3, 5].forEach(function (d) { out.bench[d] = st(bench[d]); });
      var all = { 1: [], 3: [], 5: [] };
      STRATS.forEach(function (s) {
        [1, 3, 5].forEach(function (d) { all[d] = all[d].concat(pool[s][d]); });
        out.rows.push({ name: s, sig: sig[s], d1: st(pool[s][1]), d3: st(pool[s][3]), d5: st(pool[s][5]) });
      });
      out.overall = { d1: st(all[1]), d3: st(all[3]), d5: st(all[5]) };
      S.bt = out;
      renderBT(out);
      stage('回测完成', 100);
    } catch (e) {
      stage('出错：' + e.message, 100, 'err');
    } finally {
      busy(false);
    }
  }

  function pct(x, d) { if (x === null) return '—'; return (x > 0 ? '+' : '') + x.toFixed(d || 2) + '%'; }

  function renderBT(o) {
    var h = '<div class="btop"><button class="back" id="back">‹ 返回选股</button>'
      + '<div class="btt">近 ' + o.days + ' 个交易日 ｜ 次日开盘买入</div></div>';
    if (o.bench[5]) {
      h += '<div class="bench">全市场基准（等权）　1日 <b class="' + cls(o.bench[1].avg) + '">' + pct(o.bench[1].avg) + '</b>'
        + '　5日 <b class="' + cls(o.bench[5].avg) + '">' + pct(o.bench[5].avg) + '</b></div>';
    }
    if (o.overall.d5) {
      h += '<div class="bench">全部信号 ' + o.overall.d5.n + ' 笔　1日胜率 <b>' + o.overall.d1.win.toFixed(0) + '%</b>'
        + '　5日均值 <b class="' + cls(o.overall.d5.avg) + '">' + pct(o.overall.d5.avg) + '</b></div>';
    }
    o.rows.forEach(function (r) {
      if (!r.d1) {
        h += '<section><h2>' + r.name + '<em>0 笔</em></h2><div class="kbox dim">样本不足</div></section>';
        return;
      }
      h += '<section><h2>' + r.name + '<em>' + r.sig + ' 笔</em></h2><div class="kbox">'
        + kpi('1日胜率', r.d1.win.toFixed(0) + '%', '')
        + kpi('1日均值', pct(r.d1.avg), cls(r.d1.avg))
        + kpi('5日胜率', r.d5.win.toFixed(0) + '%', '')
        + kpi('5日均值', pct(r.d5.avg), cls(r.d5.avg))
        + kpi('最好一笔', pct(r.d5.best, 1), 'up')
        + kpi('最差一笔', pct(r.d5.worst, 1), 'down')
        + '</div></section>';
    });
    h += '<div class="note">口径：信号日次日开盘买入，持有至第 N 个交易日收盘。不含手续费与滑点，日线不复权，除权日会有跳空误差。样本少于一二十笔的策略，统计意义有限。</div>';
    $('list').innerHTML = h;
    $('back').onclick = function () { S.view = 'pick'; renderRows(S.rows, null); };
  }

  function kpi(label, val, c) {
    return '<div class="k"><span>' + label + '</span><b class="' + (c || '') + '">' + val + '</b></div>';
  }
  function cls(v) { return v > 0 ? 'up' : (v < 0 ? 'down' : ''); }

  /* ---------- 数据面板 ---------- */
  function togglePanel() {
    var p = $('panel');
    p.classList.toggle('on');
    if (p.classList.contains('on')) refreshPanel();
  }

  async function refreshPanel() {
    var m = (await TDXData.getMeta()) || {};
    var n = S.K ? S.K.size : 0;
    if (!n) { S.K = await TDXData.loadAllKlines(); n = S.K.size; }
    $('ptxt').innerHTML = '本地股票 <b>' + n + '</b> 只<br>数据截止 <b>' + (m.lastDate || '—') + '</b>'
      + '<br>上次同步 ' + (m.updatedAt ? new Date(m.updatedAt).toLocaleString('zh-CN') : '—');
  }

  async function syncDaily() {
    if (S.busy) return;
    busy(true);
    try {
      var snap = await TDXData.fetchSnapshot(null, function (d, t) { stage('行情 ' + d + '/' + t, 100 * d / t / 4); });
      var K = await ensureK();
      var have = new Set(K.keys());
      stage('同步日线 ' + have.size + '/' + snap.length, 25);
      var r = await TDXData.downloadAll(snap.map(function (s) { return s.code; }), have, function (d, t, f) {
        stage('同步日线 ' + d + '/' + t + (f ? '（失败 ' + f + '）' : ''), 25 + 70 * d / t);
      });
      var latest = await TDXData.fetchLatestDate();
      S.meta = { lastDate: latest, updatedAt: Date.now() };
      await TDXData.putMeta(S.meta);
      S.K = await TDXData.loadAllKlines();
      stage('同步完成，新增 ' + r.ok + ' 只，失败 ' + r.failed + ' 只', 100);
      updateMeta();
      refreshPanel();
    } catch (e) {
      stage('同步失败：' + e.message, 100, 'err');
    } finally { busy(false); }
  }

  async function wipe() {
    if (!confirm('清空本地日线数据？下次需要重新下载（3-5 分钟）')) return;
    await TDXData.clearAll();
    S.K = null; S.meta = null;
    stage('本地数据已清空', 0);
    updateMeta(); refreshPanel();
  }

  function fmtTs() {
    var d = new Date(), p = function (x) { return (x < 10 ? '0' : '') + x; };
    return (d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  /* ---------- 启动 ---------- */
  async function boot() {
    try { S.hist = JSON.parse(localStorage.getItem(LS_HIST) || '[]'); } catch (e) { S.hist = []; }
    try {
      await TDXData.getMeta();
    } catch (e) {
      stage('这台浏览器不允许本地存储，无法保存日线。请把本文件放到任意网页空间（如 GitHub Pages）后用链接打开。', 0, 'err');
      return;
    }
    S.meta = (await TDXData.getMeta()) || {};
    updateMeta();
    if (S.hist.length) {
      S.rows = S.hist[0].rows;
      renderRows(S.rows, '数据 <b>' + S.hist[0].date + '</b> ｜ 命中 <b>' + S.rows.length + '</b> 只 ｜ ' + S.hist[0].ts);
      renderChips();
      $('cp').disabled = !S.rows.length;
    } else {
      renderRows(null, null);
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    $('go').onclick = runPicker;
    $('bt').onclick = function () { if (S.view === 'bt' && S.bt) { S.view = 'pick'; renderRows(S.rows, null); } else runBacktest(); };
    $('gear').onclick = togglePanel;
    $('sync').onclick = syncDaily;
    $('wipe').onclick = wipe;
    $('cp').onclick = async function () {
      if (!S.rows.length) return;
      var txt = S.rows.map(function (r) { return r.code + ',' + r.name; }).join('\n');
      try { await navigator.clipboard.writeText(txt); }
      catch (e) {
        var ta = document.createElement('textarea');
        ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      var b = $('cp'); b.textContent = '已复制';
      setTimeout(function () { b.textContent = '复制'; }, 1500);
    };
    boot();
  });
})();

</script>
